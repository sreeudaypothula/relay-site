<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Indrashikha Media Redesign</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
/* Layout: a centred page of borderless white tiles on a warm-grey canvas. Pill navigation on top; the Today view is a bento whose centrepiece draws the week as one block per planned post. In Phone view the same surface sits in a device frame and container queries switch to a floating tab bar. Single light look by choice. */
:root{
  color-scheme:light;
  --canvas:#F2F2EE; --tile:#FFFFFF; --well:#E9E9E4; --line:#EDEDE8;
  --ink:#131417; --soft:#3A3E46; --muted:#696E78; --faint:#A3A7AF;
  --hot:#FF4A1C; --hot-soft:#FFE4DB; --hot-ink:#B62E0A;
  --agent:#5B41F0; --agent-soft:#E8E3FF;
  --ok:#0F7A45; --ok-soft:#DAF2E4; --warn:#9A5C06; --warn-soft:#FBEACB; --bad:#BF2A1C; --bad-soft:#FBDCD7;
  --sans:"Geist","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--canvas);color:var(--ink);font:15px/1.45 var(--sans);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.025em;text-wrap:balance}
p{margin:0}
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--ink);color:#fff;font-size:13px}
.strip .about{flex:1 1 260px;min-width:0;color:#C9CBD1}
.strip .about b{color:#fff;font-weight:600}
.seg{display:inline-flex;border-radius:999px;padding:3px;background:#2A2C32}
.seg button{border:0;background:none;padding:4px 13px;border-radius:999px;font-weight:500;font-size:13px;color:#C9CBD1}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.link{border:0;background:none;color:#fff;font-weight:500;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}
.stage{flex:1;min-height:0;display:flex}
.stage.phone{align-items:center;justify-content:center;padding:14px;overflow:auto;background:radial-gradient(circle at 50% 0,#fff,var(--canvas) 60%)}
.device{flex:1;min-width:0;min-height:0;display:flex}
.stage.phone .device{flex:none;width:394px;height:min(812px,100%);min-height:560px;border:11px solid var(--ink);border-radius:46px;overflow:hidden;box-shadow:0 30px 70px rgb(19 20 23 / .28)}
@media (max-width:520px){ .stage.phone{padding:0} .stage.phone .device{width:100%;height:100%;border:0;border-radius:0;box-shadow:none} .seg.viewsw{display:none} }

.app{container:app / inline-size;flex:1;min-width:0;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--canvas)}
.top{display:flex;align-items:center;gap:14px;padding:16px 28px 6px;max-width:1340px;width:100%;margin:0 auto}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px;letter-spacing:-.03em;border:0;background:none;padding:0;white-space:nowrap;flex:none}
.brand i{width:20px;height:20px;border-radius:6px;background:var(--hot);display:block;flex:none}
.pills{display:flex;gap:2px;background:var(--well);border-radius:999px;padding:4px}
.nav{border:0;background:none;border-radius:999px;padding:7px 11px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.nav:hover{color:var(--ink)}
.nav[aria-current="page"]{background:var(--tile);color:var(--ink);box-shadow:0 1px 2px rgb(19 20 23 / .08)}
.nav .n{font-size:12px;font-weight:600;background:var(--hot);color:#fff;border-radius:999px;padding:0 7px;line-height:18px}
.nav svg{display:none}
.top .sp{flex:1}
.client{display:flex;align-items:center;gap:8px;background:var(--tile);border-radius:999px;padding:5px 14px 5px 5px;font-weight:500;white-space:nowrap}
.client .mark{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:600;font-size:11px}
main{flex:1;min-width:0;overflow:auto}
.wrap{max-width:1340px;margin:0 auto;padding:18px 28px 56px}
.tabs{display:none}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px;margin-bottom:22px}
.head>div{flex:1 1 320px;min-width:0}
.head h1{font-size:34px;line-height:1.08;letter-spacing:-.04em}
.head p{color:var(--muted);margin-top:6px;font-size:16px;max-width:64ch}
.btn{border:0;background:var(--well);border-radius:999px;padding:9px 16px;font-weight:500;white-space:nowrap;color:var(--ink)}
.btn:hover{background:#DEDED8}
.btn.pri{background:var(--ink);color:#fff} .btn.pri:hover{background:#000}
.btn.agent{background:var(--agent);color:#fff}
.btn.lite{background:#fff;color:var(--ink)}
.btn.sm{padding:6px 13px;font-size:14px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.tile{background:var(--tile);border-radius:24px;padding:24px;min-width:0}
.tile>h2{font-size:17px}
.tile.hero{display:flex;flex-direction:column} .tile.hero .foot{margin-top:auto;padding-top:20px}
.lab{color:var(--muted);font-size:14px}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.s8{grid-column:span 8} .s7{grid-column:span 7} .s5{grid-column:span 5} .s4{grid-column:span 4} .s3{grid-column:span 3} .s6{grid-column:span 6} .s12{grid-column:span 12}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start}

/* the week, one block per planned post */
.big{font-size:92px;line-height:.92;font-weight:600;letter-spacing:-.06em;margin:10px 0 8px}
.big small{font-size:34px;color:var(--faint);letter-spacing:-.04em;font-weight:500}
.week{display:flex;gap:4px;margin:22px 0 14px}
.week i{flex:1;height:52px;border-radius:7px;background:var(--well)}
.week i:first-child{border-radius:16px 7px 7px 16px} .week i:last-child{border-radius:7px 16px 16px 7px}
i.posted{background:var(--ink)} i.ready{background:#8C8F97} i.you{background:var(--hot)} i.blocked{background:repeating-linear-gradient(135deg,var(--bad) 0 5px,#E0786E 5px 10px)} i.gap{background:var(--well)}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:14px;color:var(--soft)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:11px;height:11px;border-radius:3px;display:block}
.legend b{font-weight:600}
.chrows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 28px;margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.chrow{display:flex;align-items:center;gap:10px;font-size:14px}
.chrow .nm{width:86px;flex:none;font-weight:500}
.chrow .dots{display:flex;gap:4px;flex:1}
.chrow .dots i{width:16px;height:16px;border-radius:50%;display:block}
.chrow .v{color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:20px}
.foot span{color:var(--muted);font-size:14px;flex:1 1 180px;min-width:0}

.num{font-size:56px;line-height:1;font-weight:600;letter-spacing:-.05em;margin:8px 0 4px}
.rows{display:flex;flex-direction:column;margin:12px -10px -10px}
.row{display:flex;gap:12px;align-items:center;padding:12px 10px;border-top:1px solid var(--line)}
.rows>.row:first-child{border-top-color:transparent}
.row .txt{flex:1;min-width:0}
.row .txt b{display:block;font-weight:500;line-height:1.3}
.row .txt span{color:var(--muted);font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .acts{display:flex;gap:6px;flex:none}
.row.click{cursor:pointer} .row.click:hover{background:#F7F7F4;border-radius:14px;border-top-color:transparent} .row.click:hover+.row{border-top-color:transparent}
.row.sel,.row.sel:hover{background:var(--ink);color:#fff;border-top-color:transparent;border-radius:14px} .row.sel+.row{border-top-color:transparent}
.row.sel .txt span{color:#B9BCC3} .row.sel .btn{background:#fff;color:var(--ink)}
.kind{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px}
.kind.block{background:var(--bad-soft);color:var(--bad)} .kind.agent{background:var(--agent-soft);color:var(--agent)}
.kind.appr{background:var(--hot-soft);color:var(--hot-ink)} .kind.hand{background:var(--well);color:var(--ink)} .kind.task{background:var(--well);color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--hot-soft);color:var(--hot-ink)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.agent{background:var(--agent-soft);color:var(--agent)} .pill.plain{background:var(--well);color:var(--muted)} .pill.acc{background:var(--ink);color:#fff}
.ch{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500;white-space:nowrap}
.ch i{width:9px;height:9px;border-radius:50%;background:var(--c);display:block}
.empty{padding:34px 16px;color:var(--muted);text-align:center}
.empty b{display:block;color:var(--ink);font-size:20px;font-weight:600;letter-spacing:-.02em;margin-bottom:2px}

.sheetday{margin-top:14px}
.slot{display:grid;grid-template-columns:78px 16px minmax(0,1fr);gap:0 10px}
.slot time{font-weight:600;font-size:14px;padding-top:8px;color:var(--muted)}
.slot .lineg{position:relative}
.slot .lineg::before{content:"";position:absolute;left:7px;top:0;bottom:0;width:2px;background:var(--line)}
.slot .lineg::after{content:"";position:absolute;left:2px;top:11px;width:12px;height:12px;border-radius:50%;background:var(--dot,var(--faint));box-shadow:0 0 0 4px var(--tile)}
.slot .body{padding:6px 0 14px;min-width:0}
.slot .body b{font-weight:500;display:block;line-height:1.3}
.slot .body .m{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:4px}
.nowmark{margin:0 0 8px 66px;border-top:2px solid var(--hot);position:relative;height:0}
.nowmark span{position:absolute;right:0;top:-11px;background:var(--hot);color:#fff;font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 9px}

.agentile{background:var(--agent);color:#fff;display:flex;flex-direction:column}
.agentile .lab{color:#D6CEFF}
.agentile h2{font-size:22px;line-height:1.18;margin:10px 0 16px;letter-spacing:-.03em}
.prog{display:flex;gap:5px;margin-bottom:8px}
.prog i{flex:1;height:8px;border-radius:999px;background:rgb(255 255 255 / .28);display:block}
.prog i.d{background:#fff}
.prog i.r{background:#fff;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.agentile .st{color:#E3DDFF;font-size:14px}
.agentile ol{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;flex:1;font-size:14px;color:#D6CEFF}
.agentile ol li{display:flex;gap:9px;align-items:flex-start}
.agentile ol li::before{content:"";flex:none;width:16px;height:16px;border-radius:50%;margin-top:2px;box-shadow:inset 0 0 0 2px rgb(255 255 255 / .5)}
.agentile ol li.d{color:#fff} .agentile ol li.d::before{background:#fff;box-shadow:none}
.agentile ol li em{font-style:normal;background:rgb(255 255 255 / .18);border-radius:999px;padding:0 8px;font-size:12px;margin-left:4px;white-space:nowrap}
.agentile .foot{margin-top:18px}
.tile.sig{display:flex;flex-direction:column}
.bars7{display:flex;align-items:flex-end;gap:6px;flex:1;min-height:90px;margin-top:16px}
.bars7 i{flex:1;border-radius:6px 6px 2px 2px;background:var(--well);display:block}
.bars7 i.t{background:var(--hot)}
.days7{display:flex;gap:6px;margin-top:6px;font-size:12px;color:var(--faint)}
.days7 span{flex:1;text-align:center}


.tg{display:flex;flex-direction:column;gap:13px;margin-top:16px}
.tl{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;margin-bottom:5px}
.tl span{color:var(--soft)} .tl b{font-weight:600;white-space:nowrap} .tl small{color:var(--faint);font-weight:400;font-size:13px}
.tb{height:8px;border-radius:999px;background:var(--well);overflow:hidden} .tb i{display:block;height:100%;border-radius:999px;background:var(--hot)}
.slot time{white-space:nowrap}
.ev.ghost.blk{box-shadow:inset 0 0 0 1.5px var(--bad-soft);background:repeating-linear-gradient(135deg,#fff 0 6px,var(--bad-soft) 6px 12px);color:var(--bad)}

.newp{margin-right:2px}
.kv{display:grid;grid-template-columns:84px minmax(0,1fr);gap:7px 12px;margin:0 0 22px;font-size:14.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.gauge{position:relative;display:flex;gap:3px;height:16px}
.gauge .z{border-radius:5px;display:block} .gauge .z.ok{flex:25;background:var(--ok)} .gauge .z.warn{flex:25;background:#E3A53A} .gauge .z.bad{flex:50;background:var(--bad)}
.gauge i{position:absolute;top:-7px;width:6px;height:30px;border-radius:3px;background:var(--ink);box-shadow:0 0 0 3px var(--tile);transform:translateX(-50%);transition:left .35s cubic-bezier(.2,.8,.2,1)}
.gl{position:relative;height:18px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.gl.up{margin:14px 0 12px;height:16px}
.axis{margin-top:0}
.gl span{position:absolute;transform:translateX(-50%);white-space:nowrap} .gl span:first-child{transform:none} .gl span[style*="100%"]{transform:translateX(-100%)}
.rules{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:14px;font-size:14px;color:var(--muted)}
.rules b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}
.rng{width:100%;margin-top:20px;accent-color:var(--ink);height:28px}
.axis{position:relative;height:16px;border-radius:999px;background:var(--well)}
.axis .rg{position:absolute;top:0;bottom:0;border-radius:999px;background:var(--bad)}
.axis i{position:absolute;top:-7px;width:6px;height:30px;border-radius:3px;background:var(--ok);box-shadow:0 0 0 3px var(--tile);transform:translateX(-50%)}
.axis i.st{background:var(--ink)}
.dims{display:flex;flex-direction:column;margin-top:18px}
.dim{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.dim>div:first-child{flex:1;min-width:0} .dim b{display:block;font-weight:500} .dim span{color:var(--muted);font-size:13px}
.sc{display:flex;gap:3px;background:var(--well);border-radius:999px;padding:3px;flex:none}
.sc button{border:0;background:none;width:32px;height:32px;border-radius:50%;font-weight:600;color:var(--muted)}
.sc button[aria-pressed="true"]{background:var(--ink);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:0;background:var(--tile);border-radius:999px;padding:7px 14px;font-weight:500;font-size:14px;color:var(--soft)}
.chip small{color:var(--faint);font-size:13px;margin-left:3px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.detail{display:flex;flex-direction:column;gap:14px}
.detail>.pill,.detail>.btnrow>.pill{align-self:flex-start}
.detail h2{font-size:24px;line-height:1.15;letter-spacing:-.035em}
.detail .why{color:var(--muted)}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.steps li{display:flex;gap:10px;align-items:flex-start}
.steps li i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--well);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:600;color:var(--muted)}
.steps li.done i{background:var(--ink);color:#fff}
.steps li.run i{background:var(--agent);color:#fff;animation:pulse 1s ease-in-out infinite}
.steps li.pub b{color:var(--hot-ink);font-weight:500}
.note{background:var(--canvas);border-radius:16px;padding:12px 14px;font-size:14px}
.note b{font-weight:600}
.note.bad{background:var(--bad-soft)} .note.agent{background:var(--agent-soft)} .note.ok{background:var(--ok-soft)}
.cap{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--canvas);border-radius:16px;padding:14px;font-size:14.5px}
.field{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:14px}
.in{border:1.5px solid var(--well);background:var(--tile);border-radius:14px;padding:10px 13px;width:100%;font-weight:400}
.in:focus{outline:none;border-color:var(--ink)}
textarea.in{min-height:140px;resize:vertical}
.proof{display:inline-flex;gap:5px;align-items:center;font-size:13px;font-weight:500;color:var(--ok);background:var(--ok-soft);border-radius:999px;padding:2px 10px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day{background:var(--tile);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:6px;min-height:300px}
.day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.day h3{font-size:14px;display:flex;justify-content:space-between;font-weight:600;letter-spacing:0;padding:2px 4px 6px}
.day h3 span{color:var(--hot-ink);font-weight:500}
.ev{border:0;text-align:left;background:var(--canvas);border-radius:12px;padding:8px 10px;font-size:13px;width:100%;display:block}
.ev:hover{background:var(--well)}
.ev b{display:block;font-weight:500;line-height:1.25;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ev small{color:var(--muted);display:flex;align-items:center;gap:5px;font-size:12px}
.ev small i{width:8px;height:8px;border-radius:50%;background:var(--c);display:block;flex:none}
.ev.blocked{background:var(--bad-soft)} .ev.you{background:var(--hot-soft)}
.ev.ghost{background:none;box-shadow:inset 0 0 0 1.5px var(--well);color:var(--muted)}
.ev.ghost b{font-weight:500} .ev.ghost:hover{background:var(--tile);box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink)}

.compose{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
.form{display:flex;flex-direction:column;gap:16px}
.plats{display:flex;flex-wrap:wrap;gap:6px}
.plat{border:0;background:var(--canvas);border-radius:999px;padding:7px 13px;font-weight:500;font-size:14px;display:inline-flex;gap:7px;align-items:center}
.plat i{width:9px;height:9px;border-radius:50%;background:var(--c);display:block}
.plat[aria-pressed="true"]{background:var(--ink);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.checks li{display:flex;gap:9px;align-items:flex-start}
.checks li i{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700}
.checks .pass i{background:var(--ok-soft);color:var(--ok)} .checks .warn i{background:var(--warn-soft);color:var(--warn)} .checks .block i{background:var(--bad);color:#fff}
.checks .block span{font-weight:500}
.prev{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.pv{border-radius:18px;overflow:hidden;background:var(--canvas)}
.pv header{display:flex;justify-content:space-between;gap:8px;padding:10px 14px;font-size:13px}
.pv header span{color:var(--muted)}
.pv header span.over{color:var(--bad);font-weight:600}
.pv .media{aspect-ratio:16/5;max-width:100%;margin:0 10px;border-radius:12px;background:linear-gradient(135deg,var(--well),#DCDCD6);display:grid;place-items:center;color:var(--muted);font-size:12.5px}
.pv .text{padding:10px 14px 14px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.pv .text em{color:var(--muted);font-style:normal}
.pv.chat .text{background:var(--tile);margin:0 10px 12px;border-radius:4px 16px 16px 16px}
.ph{color:var(--faint)}

.kpi .d{font-size:14px;font-weight:500}
.up{color:var(--ok)} .down{color:var(--bad)}
svg.spark{display:block;width:100%;height:44px;margin-top:14px}
.tw{overflow-x:auto;margin:10px -8px 0}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:13px;padding:8px;white-space:nowrap}
td{padding:13px 8px;border-top:1px solid var(--line);vertical-align:top}
td.num2,th.num2{text-align:right}

<script>
(() => {
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS = ['Mon 23','Tue 24','Wed 25','Thu 26','Fri 27','Sat 28','Sun 29'];
const TODAY = 2, NOW = '15:00';
// plan = posts per week from the approved plan; followers and day-30 targets as the portal showed them on 25 Nov 2026
const CH = {
  ig:{name:'Instagram', c:'#C13584', plan:7, limit:2200, kind:'feed', fol:4,  d7:0, tgt:300},
  wa:{name:'WhatsApp',  c:'#1FA855', plan:5, limit:0,    kind:'chat', fol:20, d7:1, tgt:200},

  fb:{name:'Facebook',  c:'#1877F2', plan:2, limit:63206,kind:'feed', fol:46, d7:6, tgt:null},
  li:{name:'LinkedIn',  c:'#0A66C2', plan:2, limit:3000, kind:'feed', fol:20, d7:2, tgt:null},
};
const chip = k => `<span class="ch" style="--c:${CH[k].c}"><i></i>${CH[k].name}</span>`;
const I = { today:'M4 6h16M4 12h10M4 18h7', inbox:'M4 13l2-8h12l2 8v6H4zM4 13h5a3 3 0 0 0 6 0h5', cal:'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4', plus:'M12 5v14M5 12h14', more:'M5 12h.01M12 12h.01M19 12h.01' };
const ico = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${I[k]}"/></svg>`;

const seed = () => ({
  ytBlocked:true,
  posts:[
    {id:201, t:'AI coding agents look smart, then fail at real work', ch:'tg', d:0, tm:'10:35', st:'published', cap:'AI coding agents look smart, then fail at real work. A new test put AI coding agents on real tasks…'},
    {id:202, t:'Tell AI what it may do, and what it must not do', ch:'tg', d:0, tm:'16:55', st:'published', cap:'Tell AI what it may do, and what it must not do. AI gets messy when it tries to do everything…'},
    {id:167, t:'linkedin post (to write)', ch:'li', d:0, tm:'19:45', st:'failed', cap:''},
    {id:166, t:'linkedin post (to write)', ch:'li', d:-1, on:'Sun 22 Nov', late:3, tm:'19:45', st:'failed', cap:''},
    {id:21, t:'Interview question of the day', ch:'wa', d:-1, on:'31 Oct', late:25, tm:'08:00', st:'hand', cap:'Today\'s interview question: "What\'s the difference between VLOOKUP and XLOOKUP?" Answer tomorrow on the channel. Try it yourself until then.\n{link}'},
    {id:22, t:'Weekend challenge: 80% unlock', ch:'wa', d:-1, on:'1 Nov', late:24, tm:'10:00', st:'hand', cap:'Weekend challenge: take the quiz for any one Excel chapter and score 80%. At 80%, the certificate unlocks. Tell us your score.\n{link}'},
    {id:23, t:'Tip: Power BI practice file', ch:'wa', d:-1, on:'3 Nov', late:22, tm:'10:00', st:'hand', cap:'Today\'s tip: in Power BI, clean the data first, then build the chart. The practice file is in the link.\n{link}'},
    {id:25, t:'Interview question', ch:'wa', d:-1, on:'5 Nov', late:20, tm:'10:00', st:'hand', cap:'Interview question: "What\'s the difference between a dashboard and a report?" Think about it. Answer tomorrow.\n{link}'},
    {id:29, t:'AI news reel: AI spending is nearing $1 trillion', ch:'fb', d:-1, on:'9 Nov', late:16, tm:'15:00', st:'hand', cap:'AI news: US tech stocks fell sharply as AI spending nears $1 trillion; the Nasdaq opened at its lowest level in more than two months. (Source: BBC, 30 Oct 2026)'},
  ],
  jobs:[
    {id:129, t:'Cross-promote Telegram: pin the link on the other channels and the website', st:'needs_ok', risk:'Public, and can be undone', step:2,
     steps:[['Checked the website: the Telegram link is already in the footer and on the links page',false],['Prepared the Facebook post with the "Follow us" card',false],['Publish and pin it on the other channels, then report proof',true]],
     why:'Telegram has stayed at 3 members for 14 days. Cross-promotion is the plan\'s first fix.', proof:[]},
    {id:101, t:'YouTube playlists and the first 2 long videos', st:'person', risk:'Needs a person', step:1,
     steps:[['Looked for the Excel chapter 1 and Python Class 8 chapter 1 lectures',false],['Nothing to publish: the two long videos have not been recorded yet',false]],
     why:'The agent cannot make two full lectures. Someone has to record them first.', proof:[]},
    {id:131, t:'Check every open task and close the ones that are done', st:'done', risk:'Read-only', step:3,
     steps:[['Read 9 open tasks',false],['Checked each against the live channels and the website',false],['Closed 0; 6 need a person',false]], why:'Runs each morning at 07:00.', proof:['9 tasks checked','Website links Telegram twice','0 YouTube playlists yet']},
  ],
  stuck:[[42,'Post: Excel in 60 seconds #1'],[76,'Post: Reel, overdue tasks that turn red by themselves'],[77,'Same reel, queued a second time'],[78,'Post: Certificate Friday #2'],[107,'Post: DAX basics (Instagram and Facebook went out, YouTube did not)'],[119,'Create 4 YouTube playlists']],
  tasks:[
    {id:13, t:'Find Tamil and Telugu caption reviewers', due:'due 9 Nov', late:16, done:false},
    {id:14, t:'Choose two recurring presenters', due:'due 9 Nov', late:16, done:false},
    {id:17, t:'Record the first 2 long YouTube videos', due:'due 16 Nov', late:9, done:false},
    {id:15, t:'Set up the ad account and get the budget approved in writing', due:'due 20 Nov', late:5, done:false},
    {id:49, t:'Build the launch ads in Ads Manager, paused', due:'due today', late:0, done:false},
    {id:18, t:'First live doubt session and first paid test', due:'due Thu 26 Nov', late:0, done:false},
    {id:50, t:'Launch ads go live, Thu 26 Nov at 12:00', due:'due Thu 26 Nov', late:0, done:false},
  ],
  camps:[
    {id:1, name:'TW Launch 26 Nov: Images', where:'Facebook and Instagram, feed and stories', daily:150, days:[]},
    {id:2, name:'TW Launch 26 Nov: Reels (video)', where:'Facebook and Instagram, reels, stories and feed', daily:250, days:[]},
  ],
  budget:15000,
  scores:{presence:1, consistency:1, performance:1, growth:0, tracking:1, paid:1, community:1, governance:1},
  filter:'all', sel:0, draft:null, sheet:null, toasts:[]
});
let S = seed();
const VIEWS = ['today','inbox','calendar','compose','ads','budget','strategy','agent','results','channels','why'];
const route = () => { const h = location.hash.slice(1); return VIEWS.includes(h) ? h : 'today'; };
const go = v => { if (route() === v) render(); else location.hash = v; };
const when = p => p.d < 0 ? p.on : `${DAYS[p.d]} Nov at ${p.tm}`;
const link = p => 'media.indrashikha.com/go/tw-p' + p.id;

/* ---------- derived data: one place computes what needs a person ---------- */
function needs() {
  const out = [];
  if (S.ytBlocked) out.push({key:'b-yt', type:'block', title:'YouTube is signed in to the wrong Google account', sub:`${S.stuck.length} agent jobs are stuck on this one cause`, primary:['fixyt','Fix']});
  S.jobs.filter(j => j.st === 'needs_ok').forEach(j => out.push({key:'j-'+j.id, type:'agent', id:j.id, title:'The agent needs your OK', sub:j.t, primary:['okjob','Approve'], second:['open','See steps']}));
  S.posts.filter(p => p.st === 'failed').forEach(p => out.push({key:'f-'+p.id, type:'fail', id:p.id, title:'LinkedIn post was never written', sub:`"${p.t}", scheduled ${when(p)}`, primary:['open','Fix']}));
  S.posts.filter(p => p.st === 'review').forEach(p => out.push({key:'p-'+p.id, type:'appr', id:p.id, title:'Approve: ' + p.t, sub:`${CH[p.ch].name}, ${when(p)}`, primary:['approve','Approve'], second:['open','Review']}));
  S.posts.filter(p => p.st === 'hand').forEach(p => out.push({key:'h-'+p.id, type:'hand', id:p.id, title:`Post by hand to ${CH[p.ch].name}`, sub:`${p.t}, due ${p.on}, ${p.late} days late`, primary:['open','Post']}));
  S.tasks.filter(t => !t.done).forEach(t => out.push({key:'t-'+t.id, type:'task', id:t.id, title:t.t, sub:t.late ? `${t.due}, ${t.late} days late` : t.due, primary:['donetask','Done']}));
  return out;
}
// Today shows one row per cause or kind, so a long list becomes a few decisions
function grouped() {
  const all = needs(), by = t => all.filter(n => n.type === t), out = [];
  const grp = (t, title, sub, label) => { const g = by(t); if (g.length > 1) out.push({key:'g-'+t, type:t, title:title(g), sub:sub(g), primary:['review'+t, label]}); else out.push(...g); };
  out.push(...by('block'), ...by('agent'));
  grp('fail', g => `${g.length} LinkedIn posts were scheduled without being written`, () => 'Both are titled "linkedin post (to write)" with an empty caption', 'Fix');
  grp('appr', g => `${g.length} posts wait for approval`, g => g.map(n => n.title.replace('Approve: ', '')).join(', '), 'Review');
  grp('hand', g => `${g.length} posts by hand are 16 to 25 days late`, () => 'Post them now or retire them. Four WhatsApp, one Facebook.', 'Review');
  grp('task', g => `${g.length} tasks for you, ${S.tasks.filter(t => !t.done && t.late).length} overdue`, () => 'Next: build the launch ads today; they go live Thursday 12:00', 'Open');
  return out;
}
const KIND = {block:['block','!'], fail:['block','!'], agent:['agent','✦'], appr:['appr','✓'], hand:['hand','⧉'], task:['task','□']};
const week = () => S.posts.filter(p => p.d >= 0);
function emptySlots() { const load = DAYS.map((_, i) => week().filter(p => p.d === i).length), out = []; for (const k of Object.keys(CH)) { let need = CH[k].plan - week().filter(p => p.ch === k).length; while (need-- > 0) { let best = TODAY; for (let i = TODAY; i < 7; i++) if (load[i] < load[best]) best = i; load[best]++; out.push([k, best]); } } return out; }
const gaps = () => emptySlots().filter(([k]) => !(k === 'yt' && S.ytBlocked)).length;
function slotState(p) { return p.st === 'published' ? 'posted' : p.st === 'scheduled' ? 'ready' : 'you'; }
function weekState() {
  const per = {}, all = [];
  for (const k of Object.keys(CH)) { const ps = week().filter(p => p.ch === k).map(slotState); const n = Math.max(CH[k].plan, ps.length); per[k] = Array.from({length:n}, (_, i) => ps[i] || (k === 'yt' && S.ytBlocked ? 'blocked' : 'gap')); all.push(...per[k]); }
  const order = ['posted','ready','you','blocked','gap']; all.sort((x, y) => order.indexOf(x) - order.indexOf(y));
  const c = Object.fromEntries(order.map(o => [o, all.filter(x => x === o).length]));
  return {per, all, c};
}

/* ---------- actions: every change is instant and can be undone ---------- */
function toast(msg, undo) { const t = {id:Math.random(), msg, undo}; S.toasts.push(t); render(); setTimeout(() => { S.toasts = S.toasts.filter(x => x !== t); render(); }, undo ? 6000 : 3600); }
function change(msg, fn) { const snap = JSON.stringify({ytBlocked:S.ytBlocked, posts:S.posts, jobs:S.jobs, tasks:S.tasks, stuck:S.stuck, camps:S.camps}); fn(); toast(msg, () => { Object.assign(S, JSON.parse(snap)); S.toasts = []; render(); }); }
const post = id => S.posts.find(p => p.id == id);
const job = id => S.jobs.find(j => j.id == id);
const toInbox = f => { S.filter = f; S.sel = 0; go('inbox'); };
const ACT = {
  go: v => { S.sheet = null; go(v); },
  filter: f => { S.filter = f; S.sel = 0; render(); },
  open: key => { S.sheet = key; render(); },
  close: () => { S.sheet = null; render(); },
  fixyt: () => { S.sheet = 'b-yt'; render(); },
  reviewfail: () => toInbox('block'), reviewappr: () => toInbox('appr'), reviewhand: () => toInbox('hand'), reviewtask: () => toInbox('task'),
  recheck: () => { const n = S.stuck.length; S.sheet = null; change(`YouTube reconnected. ${n} jobs are back in the agent's queue.`, () => { S.ytBlocked = false; S.stuck = []; }); },
  approve: id => { S.sheet = null; change('Approved. It goes out at its scheduled time.', () => { post(id).st = 'scheduled'; }); },
  reject: id => { const note = $('#rejnote')?.value.trim(); if (!note) { $('#rejnote')?.focus(); return toast('Add a short note so the writer knows what to change.'); } S.sheet = null; change('Sent back to the writer with your note.', () => { const p = post(id); p.st = 'draft'; p.note = note; }); },
  posted: id => { const url = $('#posturl')?.value.trim(); S.sheet = null; change('Marked as posted.', () => { const p = post(id); p.st = 'published'; p.url = url; }); },
  retire: id => { S.sheet = null; change('Retired. It leaves every list and stays in the history.', () => { S.posts = S.posts.filter(p => p.id != id); }); },
  copy: id => { const p = post(id), txt = p.cap.replace('{link}', link(p)); const done = () => toast('Caption copied. Paste it into ' + CH[p.ch].name + '.'); try { navigator.clipboard.writeText(txt).then(done, done); } catch { done(); } },
  donetask: id => change('Task marked done.', () => { S.tasks.find(t => t.id == id).done = true; }),
  okjob: id => { S.sheet = null; const j = job(id); j.st = 'running'; toast('Approved. The agent continues now.'); tick(j); },
  fill: () => change(`${gaps()} draft slots created from the plan.`, () => { let nid = Math.max(...S.posts.map(p => p.id)) + 1; for (const [k, d] of emptySlots()) if (!(k === 'yt' && S.ytBlocked)) S.posts.push({id:nid++, t:'Draft for ' + CH[k].name, ch:k, d, tm:'18:00', st:'draft', cap:''}); }),
  ghost: arg => { const [k, d] = arg.split(':'); if (k === 'yt' && S.ytBlocked) return ACT.fixyt(); S.draft = {t:'', cap:'', chs:[k], d:+d, tm:'18:00'}; go('compose'); },
  editpost: id => { const p = post(id); S.sheet = null; S.draft = {id:p.id, t:p.t, cap:p.cap, chs:[p.ch], d:Math.max(p.d, TODAY), tm:p.tm}; go('compose'); },
  plat: k => { const d = S.draft; d.chs = d.chs.includes(k) ? d.chs.filter(x => x !== k) : [...d.chs, k]; render(); },
  aidraft: () => { const d = S.draft; const topic = d.t.trim() && !/to write/i.test(d.t) ? d.t.trim() : 'This week\'s lesson'; d.cap = `${topic}: here is the one thing to remember.\n\nTry it on your own file for two minutes, then tell us what happened.\n\nThe full course is free: {link}`; render(); toast('Sample draft added. In the product this comes from the model, checked against the brand kit.'); },
  send: () => { const d = S.draft, res = checks(d); if (res.some(c => c[0] === 'block')) return; change(d.chs.length > 1 ? `${d.chs.length} posts sent for approval.` : 'Sent for approval.', () => { let nid = Math.max(...S.posts.map(p => p.id)) + 1; if (d.id) S.posts = S.posts.filter(p => p.id !== d.id); d.chs.forEach(k => S.posts.push({id:nid++, t:d.t.trim(), ch:k, d:d.d, tm:d.tm, st:'review', cap:d.cap})); S.draft = null; }); toInbox('appr'); },
  logday: id => { const v = k => Math.max(0, +($('#' + k)?.value || 0)); const d = {spend:v('lspend'), clicks:v('lclicks'), signups:v('lsign')}; if (!d.spend) { $('#lspend')?.focus(); return toast('Enter what was spent.'); } S.sheet = null; change('Results logged. The guardrail is updated.', () => { S.camps.find(c => c.id == id).days.push(d); }); },
  score: arg => { const [k, v] = arg.split(':'); S.scores[k] = +v; render(); },
  preset: v => { S.budget = +v; render(); },
  summary: () => { const w = weekState(); const txt = `Techwave Academy, week of 23 Nov: ${w.c.posted} of ${w.all.length} planned posts out so far. 41 sign-ups this week, 0 traced to social, 17 via AI assistants. Followers 95 across 6 channels. Blocking: YouTube sign-in.`; const done = () => toast('Weekly summary copied. Paste it into WhatsApp.'); try { navigator.clipboard.writeText(txt).then(done, done); } catch { done(); } },
};
function tick(j) { render(); if (j.step >= j.steps.length) { j.st = 'done'; j.proof = ['Simulated here: the real agent reports links as proof']; render(); return toast('Agent finished. In the product, proof links appear on the job.'); } setTimeout(() => { if (j.st !== 'running') return; j.step++; tick(j); }, 1300); }

/* ---------- views ---------- */
const head = (h, p, acts = '') => `<div class="head"><div><h1>${h}</h1><p>${p}</p></div>${acts}</div>`;
const actBtn = (a, key, cls = '') => a ? `<button class="btn sm ${cls}" data-act="${a[0]}" data-arg="${esc(key)}">${a[1]}</button>` : '';
function needRow(n, i, selectable) {
  const [c, s] = KIND[n.type]; const arg = a => a[0] === 'open' ? n.key : (n.id ?? '');
  return `<div class="row ${selectable ? 'click' : ''} ${selectable && i === S.sel ? 'sel' : ''}" ${selectable ? `data-act="pick" data-arg="${i}"` : ''}><span class="kind ${c}" aria-hidden="true">${s}</span><div class="txt"><b>${esc(n.title)}</b><span>${esc(n.sub)}</span></div><div class="acts">${n.second ? actBtn(n.second, arg(n.second), 'second') : ''}${actBtn(n.primary, arg(n.primary), n.type === 'agent' ? 'agent' : 'pri')}</div></div>`;
}
function vToday() {
  const ns = grouped(), raw = needs().length + (S.ytBlocked ? S.stuck.length - 1 : 0);
  const w = weekState(), total = w.all.length, good = w.c.posted + w.c.ready;
